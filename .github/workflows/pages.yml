name: Site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/images/main-window.png
      - docs/images/social-preview.png
      - wooloo/Assets.xcassets/AppIcon.appiconset/icon-256.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish wooloo.dev
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # The page shares its images with the README and the app, so they are copied in here.
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R site/. _site/
          cp docs/images/main-window.png docs/images/social-preview.png _site/
          cp wooloo/Assets.xcassets/AppIcon.appiconset/icon-256.png _site/icon.png

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

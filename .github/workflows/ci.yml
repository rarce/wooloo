name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # MarkdownView's manifest needs Swift 6.2, which ships with Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('wooloo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # CI runs the fast suite: pixel snapshots are compared locally only, since their
      # rendering depends on the macOS version and fonts.
      - name: Cache Herdr release assets
        uses: actions/cache@v5
        with:
          path: build/herdr
          key: herdr-${{ hashFiles('scripts/bundle-herdr.sh') }}

      - name: Test
        run: |
          xcodebuild test \
            -project wooloo.xcodeproj -scheme wooloo -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            -resultBundlePath build/wooloo.xcresult \
            -skip-testing:woolooTests/ViewSnapshotTests \
            -skip-testing:woolooTests/TerminalRenderingTests/testSnapshotsMatch \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Upload test results
        # Also when the job times out, so a hang leaves its results behind.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: wooloo-test-results
          path: build/wooloo.xcresult

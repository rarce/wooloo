name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.changes.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The PR's merge commit includes its head, even for forks. The complete
          # history lets the detector compare merge-base..head across every commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_policy.py changes

  test:
    name: macOS build and test
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    # MarkdownView's manifest needs Swift 6.2, which ships with Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('wooloo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # CI runs the fast suite: pixel snapshots are compared locally only, since their
      # rendering depends on the macOS version and fonts.
      - name: Cache Herdr release assets
        uses: actions/cache@v5
        with:
          path: build/herdr
          key: herdr-${{ hashFiles('scripts/bundle-herdr.sh') }}

      - name: Test performance tooling contracts
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Test
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project wooloo.xcodeproj -scheme wooloo -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            -resultBundlePath build/wooloo.xcresult \
            -skip-testing:woolooTests/ViewSnapshotTests \
            -skip-testing:woolooTests/TerminalRenderingTests/testSnapshotsMatch \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            SWIFT_STRICT_CONCURRENCY=complete \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            2>&1 | tee build/concurrency.log

      # Only package sources are cached: every migrated app source must compile in this log.
      - name: Audit migrated concurrency boundaries
        if: always() && !cancelled()
        run: python3 scripts/concurrency_audit.py build/concurrency.log

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wooloo-concurrency-log
          path: build/concurrency.log
          if-no-files-found: warn

      - name: Upload test results
        # Also when the job times out, so a hang leaves its results behind.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: wooloo-test-results
          path: build/wooloo.xcresult

  result:
    # Keep the required check's name stable. A skipped dependency by itself can
    # satisfy branch protection; explicitly reject failures and unintended skips.
    name: Build and test
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check CI results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run_tests }}
          TEST_RESULT: ${{ needs.test.result }}
        run: python3 scripts/ci_policy.py result

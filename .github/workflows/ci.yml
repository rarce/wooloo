name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # MarkdownView's manifest needs Swift 6.2, which ships with Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('xherdr.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Snapshot comparison is skipped here: the runner lacks FiraCode Nerd Font Mono.
      - name: Test
        run: |
          xcodebuild test \
            -project xherdr.xcodeproj -scheme xherdr -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            -resultBundlePath build/xherdr.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xherdr-test-results
          path: build/xherdr.xcresult
